<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Playwright+TS Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="login">
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Playwright+TS Demo</h1>
      <p class="subtitle">Sign in to continue</p>

      <form id="login-form" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" data-testid="username-input" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" data-testid="password-input" autocomplete="current-password" required />

        <button type="submit" data-testid="login-submit">Sign In</button>

        <p id="error-message" class="error" data-testid="login-error" hidden>Invalid username or password.</p>
      </form>

      <p class="hint">Demo credentials: <code>qa_name</code> / <code>qa_pass</code></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
